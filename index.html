<!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow">
        <!-- Search and Filter Feature Bar -->
        <div class="mb-8 max-w-md">
            <label for="search-input" class="sr-only">Search products</label>
            <div class="relative">
                <input type="text" id="search-input" placeholder="Search essentials... (e.g., keyboard, mouse)" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                <span class="absolute right-3 top-2.5 text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </span>
            </div>
        </div>

        <h2 class="text-2xl font-bold text-gray-900 mb-8">Featured Products</h2>
        <!-- Product Grid -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
            <!-- JavaScript injects products here -->
        </div>
    </main>

    <!-- Checkout Success Modal -->
    <div id="checkout-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
        <div class="absolute inset-0 bg-gray-900 bg-opacity-50"></div>
        <div class="bg-white rounded-lg p-8 max-w-sm w-full mx-4 relative z-10 text-center shadow-xl">
            <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-green-100 mb-4">
                <svg class="h-6 w-6 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h3 class="text-lg font-bold text-gray-900 mb-2">Order Placed Successfully!</h3>
            <p class="text-sm text-gray-500 mb-6">Thank you for your purchase. We have cleared your cart and initialized processing.</p>
            <button id="close-modal-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-md transition-colors">Continue Shopping</button>
        </div>
    </div>
